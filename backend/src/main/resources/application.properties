spring.application.name=sims
server.port=8081

#spring.datasource.url=jdbc:mysql://localhost:3306/sims?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=root

logging.file.name=logs/sims.log

# Flyway owns the schema; Hibernate only validates it against the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Store java.util.UUID as CHAR(36) so migrations/seed data use readable UUID strings.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Flyway migrations (classpath:db/migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT (override in production)
security.jwt.secret=change-me-in-production-please-use-a-long-random-secret-key-0123456789
security.jwt.expiration-ms=86400000

# Hibernate Batch processing for insert and update
spring.jpa.properties.hibernate.jdbc.batch_size=3
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

logging.level.org.hibernate.orm.jdbc.batch=TRACE

aws.s3.bucket=your-bucket-name
aws.s3.region=ap-south-1

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB